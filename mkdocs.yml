site_name: Guía Completa de Jetpack Compose
site_description: Documentación completa para aprender Jetpack Compose
site_author: Tu Nombre
site_url: https://Gil-Campos.io/jetpack-compose-docs

repo_name: Gil-Campos/jetpack-compose-docs
repo_url: https://github.com/Gil-Campos/jetpack-compose-docs

theme:
  name: material
  language: es
  palette:
    - scheme: default
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    - scheme: slate
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro
  
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate

nav:
  - Inicio: index.md
  - Primeros Pasos: getting-started.md
  - Componentes UI: components.md
  - Gestión de Estado: state-management.md
  - Mejores Prácticas: best-practices.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/tu-usuario
